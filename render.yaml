services:
  - type: web
    name: quantum-os-signaling
    runtime: node
    rootDir: packages/signaling
    buildCommand: npm install && npm run build
    startCommand: npm start
    # Starter, not Free: the free instance sleeps after 15min idle, and a cold
    # start on the next connect is what showed up in every peer's log as
    # `signaling dropped (1006)` → reconnect churn — indistinguishable from a
    # network problem until you know to look here. Starter is plenty for a
    # small WebSocket relay; nothing here needs more.
    #
    # This line documents the intent for a future blueprint-recreate — it does
    # NOT change the live service. quantum-os-signaling was hand-created, not
    # deployed from this blueprint (see the autoDeploy note below), so Render
    # ignores render.yaml's settings for it. The plan change has to be made in
    # the dashboard: Settings -> Instance Type -> Starter.
    plan: starter
    envVars:
      - key: PORT
        generateValue: false
      # A peer joining a room of N sends N-1 offers and then a burst of ICE
      # candidates, so the per-connection message rate during a join is
      # superlinear in room size. At the code default of 20/s the window blows
      # at about four peers and handshakes stop completing — while every peer
      # still appears in the room, which is indistinguishable from the others
      # never having arrived. 200/s holds a full cast; the messages are small
      # and the 64 KB payload cap and wsIndex relay auth are what actually
      # guard the server.
      - key: SIGNAL_RATE_LIMIT
        value: "200"
    # On, but it must only fire for changes to this server.
    #
    # A deploy restarts signaling, and a restart drops every peer's socket at
    # once — the whole room reconnecting together because somebody edited a help
    # string in the browser. Pages should deploy on every push (a reload is one
    # person's choice, taken when they choose it); this is everybody's.
    #
    # The control is Render's **Build Filters** (Settings -> Build & Deploy),
    # since a service Render did not create from this blueprint ignores the file:
    #
    #   Included Paths:  packages/signaling/**
    #                    render.yaml
    #
    # Included rather than ignored, so anything new in the repo defaults to not
    # restarting the room.
    autoDeploy: true
